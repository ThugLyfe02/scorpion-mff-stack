[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scorpion-mff"
version = "0.1.0"
description = "Deterministic event-sourced control plane for MFF signal ingestion, replay, paper execution, and operator review."
requires-python = ">=3.13"
dependencies = [
  "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "hypothesis>=6.112,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
scorpion-replay = "scorpion.cli:replay_main"
scorpion-health = "scorpion.cli:health_main"
scorpion-ingest = "scorpion.runtime:ingest_main"

[tool.hatch.build.targets.wheel]
packages = ["src/scorpion"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["scorpion"]
